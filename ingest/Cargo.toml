[package]
name = "threat-ingest"
version = "0.1.0"
edition = "2021"
description = "Rust-based PCAP ingest service for unidirectional traffic analysis"

[dependencies]
pcap = "1.1"
etherparse = "0.15"
rdkafka = { version = "0.36", features = ["cmake-build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive", "env"] }
