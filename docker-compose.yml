services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - threatnet
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic flow-records --partitions 4 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic flow-features --partitions 4 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic threat-alerts --partitions 2 --replication-factor 1
        echo "Topics created successfully"
    networks:
      - threatnet

  ingest:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    container_name: ingest
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=flow-records
      - PCAP_DIR=/data/pcaps
      - REPLAY_SPEED=max
    volumes:
      - ./data/pcaps:/data/pcaps:ro
    networks:
      - threatnet

  ml-inference:
    build:
      context: ./ml-service
      dockerfile: Dockerfile.inference
    container_name: ml-inference
    ports:
      - "50051:50051"
    volumes:
      - ./ml-service/models:/app/models:ro
    networks:
      - threatnet
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; ch=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=2)"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  feature-extractor:
    build:
      context: ./ml-service
      dockerfile: Dockerfile.extractor
    container_name: feature-extractor
    depends_on:
      kafka:
        condition: service_healthy
      ml-inference:
        condition: service_healthy
    environment:
      - KAFKA_BROKER=kafka:29092
      - KAFKA_INPUT_TOPIC=flow-records
      - KAFKA_OUTPUT_TOPIC=threat-alerts
      - GRPC_INFERENCE_HOST=ml-inference:50051
      - WINDOW_SECONDS=10
      - CONFIDENCE_THRESHOLD=0.8
      - PORTSCAN_MODEL_PATH=/app/models/portscan-10s2s.joblib
      - ENCRYPTED_MALWARE_MODEL_PATH=/app/models/encrypted_malware_flow.joblib
      - DDOS_MODEL_PATH=/app/models/ddos_flow.joblib
      - EXFILTRATION_MODEL_PATH=/app/models/exfiltration_flow.joblib
    volumes:
      - ./ml-service/models:/app/models:ro
    networks:
      - threatnet

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8001:8000"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=threat-alerts
      - HOST=0.0.0.0
      - PORT=8000
    networks:
      - threatnet

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - threatnet

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://dashboard:80
    depends_on:
      - dashboard
    networks:
      - threatnet

networks:
  threatnet:
    driver: bridge
